<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Spark Catcher | 로그인을 완료하지 못했습니다</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff4ec;
        --surface: #fffaf6;
        --ink: #2b201b;
        --muted: #6f5546;
        --line: #e7cdbd;
        --accent: #9b3f26;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--ink);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        width: 100%;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }

      .secondary {
        margin-top: 10px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/app-icons/spark-catcher.png" alt="" width="64" height="64" />
      <p>Spark Catcher</p>
      <h1>로그인을 완료하지 못했습니다</h1>
      <p>취소되었거나 요청이 만료되었습니다. Spark Catcher 앱에서 다시 시도해 주세요.</p>
      <a href="/ko/apps/spark-catcher/support/">지원</a>
      <a class="secondary" href="/ko/apps/spark-catcher/legal/privacy/">개인정보처리방침</a>
    </main>

  </body>
</html>
