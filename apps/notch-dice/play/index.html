<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="description" content="Open your Messages game invitation, turn or result in Notch Dice for Mac.">
  <meta property="og:title" content="Notch Dice · Messages Games">
  <meta property="og:description" content="Open the game on your Mac to join, take your turn or see the final result.">
  <title>Notch Dice · Messages Games</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f4f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px; display: grid; place-items: center; }
    main { width: 100%; max-width: 480px; padding: 32px; border: 1px solid #dfe1e5; border-radius: 20px; background: #fff; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 40px; }
    .brand { font-weight: 650; letter-spacing: -.02em; }
    h1 { font-size: 28px; line-height: 1.3; letter-spacing: -.025em; margin: 8px 0 16px; word-break: keep-all; overflow-wrap: anywhere; }
    h2 { font-size: 17px; line-height: 1.5; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.7; margin: 0 0 20px; word-break: keep-all; overflow-wrap: anywhere; }
    .platform, footer p { font-size: 14px; color: #5c626d; }
    .platform { margin: 0; }
    button, .action { font: inherit; border-radius: 9px; min-height: 44px; cursor: pointer; }
    button { border: 1px solid #dfe1e5; padding: 8px 12px; color: inherit; background: transparent; }
    .action { display: block; text-decoration: none; text-align: center; padding: 13px 16px; margin: 24px 0; font-weight: 600; }
    .primary { background: #1769e0; color: white; }
    .secondary { border: 1px solid #dfe1e5; color: inherit; }
    .primary:hover { background: #1257bc; }
    .secondary:hover, button:hover { background: #edf2fa; }
    .action:active, button:active { opacity: .8; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid #1769e0; outline-offset: 4px; }
    footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #dfe1e5; }
    footer p:last-child { margin-bottom: 0; }
    @media (prefers-color-scheme: dark) {
      :root { color: #f3f4f5; background: #191b20; }
      main { background: #24272e; border-color: #41444c; }
      button, footer, .secondary { border-color: #41444c; }
      .secondary:hover, button:hover { background: #303846; }
      .platform, footer p { color: #b3b8c2; }
    }
    @media (max-width: 360px) { main { padding: 24px 20px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">Notch Dice</span><button id="language" type="button" aria-label="Switch to English">English</button></header>
    <p class="platform" data-copy="platform">Mac용 메시지 대전</p>
    <h1 data-copy="title">메시지에서 게임을 이어가세요</h1>
    <p id="game-status" role="status" aria-live="polite">메시지에서 받은 경기 링크를 열어 주세요.</p>
    <a id="open-game" class="action primary" aria-describedby="game-status" hidden>Notch Dice에서 열기</a>
    <noscript><p>이 페이지에서 앱을 열려면 JavaScript가 필요합니다. / JavaScript is required to open the app from this page.</p></noscript>
    <footer id="installation">
      <h2 data-copy="installationTitle">Notch Dice가 없으신가요?</h2>
      <p id="availability">Notch Dice는 App Store 출시를 준비하고 있습니다.</p>
      <a id="download" class="action secondary" hidden>App Store에서 설치</a>
      <p data-copy="afterInstall">설치 후에는 메시지로 돌아가 처음 받은 초대 링크를 다시 열어 주세요.</p>
    </footer>
  </main>
  <script type="module" src="./install.mjs"></script>
</body>
</html>
