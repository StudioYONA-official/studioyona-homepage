<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="description" content="Open your Connect Four invitation, turn or result in Notch Dice for Mac.">
  <meta property="og:title" content="Notch Dice · Connect Four">
  <meta property="og:description" content="Open the game on your Mac to join, take your turn or see the final result.">
  <title>Notch Dice · Connect Four</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f4f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px; display: grid; place-items: center; }
    main { width: 100%; max-width: 480px; padding: 32px; border: 1px solid #dfe1e5; border-radius: 20px; background: #fff; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 40px; }
    .brand { font-weight: 650; letter-spacing: -.02em; }
    h1 { font-size: 28px; line-height: 1.3; letter-spacing: -.025em; margin: 8px 0 16px; }
    p { font-size: 16px; line-height: 1.7; margin: 0 0 20px; word-break: keep-all; overflow-wrap: anywhere; }
    .platform, footer p { font-size: 14px; color: #5c626d; }
    .platform { margin: 0; }
    button, .download { font: inherit; border-radius: 9px; min-height: 44px; cursor: pointer; }
    button { border: 1px solid #dfe1e5; padding: 8px 12px; color: inherit; background: transparent; }
    .download { display: block; text-decoration: none; background: #1769e0; color: white; text-align: center; padding: 13px 16px; margin: 24px 0; font-weight: 600; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid #1769e0; outline-offset: 4px; }
    footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #dfe1e5; }
    footer p:last-child { margin-bottom: 0; }
    @media (prefers-color-scheme: dark) {
      :root { color: #f3f4f5; background: #191b20; }
      main { background: #24272e; border-color: #41444c; }
      button, footer { border-color: #41444c; }
      .platform, footer p { color: #b3b8c2; }
    }
    @media (max-width: 360px) { main { padding: 24px 20px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">Notch Dice</span><button id="language" type="button" aria-label="Switch to English">English</button></header>
    <p class="platform" data-copy="platform">Mac용 Connect Four</p>
    <h1 data-copy="title">메시지로 함께 플레이하세요</h1>
    <p id="availability" role="status" aria-live="polite">Notch Dice는 App Store 출시를 준비하고 있습니다.</p>
    <a id="download" class="download" hidden>App Store에서 설치</a>
    <footer>
      <p data-copy="installed">이미 설치하셨다면 메시지로 돌아가 경기 링크를 다시 눌러 주세요.</p>
      <p data-copy="afterInstall">처음 설치한 뒤에는 메시지에서 처음 받은 초대 링크를 다시 눌러 참여해 주세요.</p>
    </footer>
  </main>
  <script type="module" src="./install.mjs"></script>
</body>
</html>
